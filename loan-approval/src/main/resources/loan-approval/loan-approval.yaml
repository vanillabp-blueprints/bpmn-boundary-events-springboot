# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# lower priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100

# The non-interrupting reminder puts a second token into the process, and the aggregate has no
# version attribute. So VanillaBP warns at startup that two branches may overwrite each other.
# Here they do not: the reminder writes only remindersSent, the answer only partnerApproved and
# the task id, and @DynamicUpdate on the aggregate writes nothing but the columns a branch
# changed. VanillaBP cannot see that in the code, so the review is stated here, and the warning
# stays silent. The key is read at the workflow only. Whoever changes the model or makes a
# branch write another attribute checks again whether this line still holds.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          concurrent-branches-reviewed: true
