# Everything specific to Camunda 8, loaded only while the 'camunda8' profile applies. The
# Maven profile of the same name activates it for the test as well, and CI overrides the
# address through the environment.
vanillabp:
  adapters:
    camunda8:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
      rest-address: http://localhost:8080
      # With a lease, the cluster takes the answer of the current activation only. But on
      # 8.10 the gateway can lose a leased job when a long poll ends, and the job then waits
      # for a whole job-timeout. Until Camunda fixes that, the adapter advises this value
      # (decision 88 of the adapter), so the blueprint shows it. Moving to 'use' later costs
      # nothing, because a job which was never leased can be leased at any time. The key has
      # no default. On a cluster before 8.10 it is read and does nothing:
      # https://github.com/camunda-community-hub/vanillabp-camunda8-adapter/wiki/Configuration#a-job-somebody-else-holds
      job-lease: do-not-use
